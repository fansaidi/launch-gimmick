# Builds and deploys both static apps to a single GitHub Pages site:
# the builder app at the root (/launch-gimmick/) and the player at
# /launch-gimmick/player/. Neither needs a server - the player is a
# self-contained camera/gesture demo, and the builder talks to Supabase
# directly from the browser (see builder/src/lib/supabase.ts).
name: Deploy static content to Pages

on:
  # Runs on pushes to the active work branch. Switch this back to 'main'
  # once this branch is merged/promoted.
  push:
    branches: ['claude/project-overview-exzbg9']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install db dependencies
        run: npm ci
        working-directory: ./db
      - name: Run migrations
        run: npm run db:migrate
        working-directory: ./db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Install player dependencies
        run: npm ci
      - name: Build player
        run: npm run build
      - name: Install builder dependencies
        run: npm ci
        working-directory: ./builder
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Build builder
        run: npm run build
        working-directory: ./builder
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Merge both builds into one deploy directory
        run: |
          mkdir -p deploy
          cp -r builder/dist/. deploy/
          mkdir -p deploy/player
          cp -r dist/. deploy/player/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload merged directory (builder at root, player at /player)
          path: './deploy'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
